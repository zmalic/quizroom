# An example deployment on Fly.io. The app does not need it: any host that
# runs the Docker image works. Change `app` to your own app name to use it.
app = "quizroom-demo"
primary_region = "arn" # Stockholm

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3000"

[http_service]
  internal_port = 3000
  force_https = true
  # Rooms live in memory, so the machine stays on and there is only one.
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/healthz"
    interval = "30s"
    timeout = "3s"
    grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
